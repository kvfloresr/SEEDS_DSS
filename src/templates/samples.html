{% extends "base.html" %}
{% block content %}
<h3 class="mb-4 text-success">Registro de Muestras</h3>

<div class="card shadow-sm mb-4">
<div class="card-header bg-success text-white fw-bold">Agregar nueva muestra</div>
<div class="card-body">
    <form method="POST" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">Lote asociado</label>
        <select name="lot_id" class="form-select" required>
        <option value="">Seleccione lote...</option>
        {% for lot in lots %}
            <option value="{{ lot.lot_id }}">{{ lot.producer }} - {{ lot.variety }}</option>
        {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label">Fecha de muestra</label>
        <input type="date" name="sample_date" class="form-control" required>
    </div>
    <div class="col-md-3">
        <label class="form-label">Analista</label>
        <input type="text" name="analyst" class="form-control" placeholder="Nombre del analista" required>
    </div>
    <div class="col-md-12">
        <label class="form-label">Observaciones</label>
        <input type="text" name="observations" class="form-control" placeholder="Detalles o comentarios">
    </div>
    <div class="col-md-12 text-end">
        <button type="submit" class="btn btn-success px-4">Guardar muestra</button>
    </di v>
    </form>
</div>
</div>

<div class="card shadow-sm">
<div class="card-header bg-light fw-bold">Muestras registradas</div>
<div class="card-body">
    <table class="table table-bordered table-striped align-middle">
    <thead class="table-success">
        <tr>
        <th>Lote</th>
        <th>Fecha</th>
        <th>Analista</th>
        <th>Observaciones</th>
        </tr>
    </thead>
    <tbody>
        {% for s in samples %}
        <tr>
        <td>{{ s.lot_name }}</td>
        <td>{{ s.sample_date }}</td>
        <td>{{ s.analyst }}</td>
        <td>{{ s.observations }}</td>
        </tr>
        {% endfor %}
    </tbody>
    </table>
</div>
</div>
{% endblock %}
